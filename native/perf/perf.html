<!doctype html><meta charset="utf-8"><title>perf</title><script type="module">
const o = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const w = new Worker("probe-worker.mjs", { type: "module" });
w.onmessage = (e) => { if (e.data.type === "result") window.RESULT = e.data; else (window.LOG ||= []).push(e.data.m); };
w.onerror = (e) => { window.RESULT = { error: "worker error " + e.message }; };
w.postMessage(o);
</script>
