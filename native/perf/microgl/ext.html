<!doctype html><script>
const gl = document.createElement("canvas").getContext("webgl2", { powerPreference: "high-performance" });
const dbg = gl.getExtension("WEBGL_debug_renderer_info");
window.RESULT = { renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "?", ext: gl.getSupportedExtensions(), maxDrawBuffers: gl.getParameter(gl.MAX_DRAW_BUFFERS), maxUBO: gl.getParameter(gl.MAX_UNIFORM_BLOCK_SIZE) };
</script>
