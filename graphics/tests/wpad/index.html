<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wii-Gasteingabetest</title><style>body{background:#101820;color:#e3edf4;font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}button{padding:12px;background:#69cef5;border:0;border-radius:6px}pre{white-space:pre-wrap}li{margin:8px 0}.pass{color:#94dfad}.fail{color:#ffa3af}</style><h1>Wii-Gasteingabetest im Browser</h1><p>Dieser Test führt das eigene libogc/WPAD-Programm im echten WASM-Kern aus und prüft, was der Gast über Bluetooth-HLE liest. Die Zustände werden durch den produktiven TypeScript-Adapter gesetzt. Das ist kein Spielgeschwindigkeits-Test.</p><button id="start">Gasttest starten</button><p id="status" role="status">Bereit</p><ol id="results"></ol><details><summary>Rohdaten</summary><pre id="raw"></pre></details><script type="module">
const start=document.querySelector('#start'),status=document.querySelector('#status'),list=document.querySelector('#results'),raw=document.querySelector('#raw');let worker;
start.onclick=()=>{start.disabled=true;list.replaceChildren();status.textContent='WASM-Kern und Wii-Homebrew werden geladen …';worker=new Worker(new URL('./worker.mjs',import.meta.url),{type:'module'});worker.onmessage=({data})=>{if(data.type==='check'){const item=document.createElement('li');item.className=data.pass?'pass':'fail';item.textContent=`${data.pass?'PASS':'FAIL'}: ${data.name}`;list.append(item);}else if(data.type==='result'){status.textContent=`${data.pass?'PASS':'FAIL'}: ${data.passed}/${data.total} Gastprüfungen`;raw.textContent=JSON.stringify(data,null,2);document.title=`${data.pass?'PASS':'FAIL'} – Wii-Gasteingabetest`;worker.terminate();}else if(data.type==='log'){status.textContent=data.message;}};worker.onerror=e=>{status.textContent=`Worker-Fehler: ${e.message}`;};worker.postMessage({type:'run'});};
</script></html>
